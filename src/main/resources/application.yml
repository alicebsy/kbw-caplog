spring:
  application:
    name: caplog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/caplog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:caplog}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.type.descriptor.sql.BasicBinder: info
    org.springframework.web: info
    org.springframework.http.converter: info
server:
  port: 8080

# API base URL (스크린샷 등 리소스 절대 URL 생성용)
app:
  baseUrl: ${APP_BASE_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET}
  access-hours: ${JWT_ACCESS_HOURS:1}
  refresh-days: ${JWT_REFRESH_DAYS:14}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

caplog:
  security:
    trust-forwarded-headers: ${CAPLOG_TRUST_FORWARDED_HEADERS:false}
  geocode:
    provider: kakao
    throttleMillis: 250      # 호출 간 최소 간격(밀리초)
    maxAttempts: 3           # 재시도 상한

kakao:
  restApiKey: ${KAKAO_REST_API_KEY:}  # 환경변수로 주입
  geocode-url: https://dapi.kakao.com/v2/local/search/address.json
